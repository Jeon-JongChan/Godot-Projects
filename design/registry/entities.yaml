# Entity Registry — Eradel
# LAYOUT: block lists at col 0; entries "  - name: VALUE" at col 2; fields at col 4

entities:
  - name: soul_relic
    source: design/gdd/soul-exploitation.md
    attributes:
      states: "UNRESOLVED, MEMORIALIZED, PAUPER_BURIED, EXPLOITED_SUPPRESS, EXPLOITED_BUFF, EXPIRED_ON_SUCCESSION"
      fields: "id, merc_name, job, grade, level, death_day, state, resolved_day"
    referenced_by:
      - design/gdd/generation-succession.md
      - design/gdd/memorial-chronicle.md
      - design/gdd/rift-seal-endless.md
  - name: exploitation_brand
    source: design/gdd/soul-exploitation.md
    attributes:
      stack_range: "0-15"
      cap_recruit_pen: 100.0
      cap_heal_pen: 45
      min_heal_rate_floor: 10
      cap_morale_pen: 10
      qualitative_thresholds: "3 (treat +20G, dismiss -8 morale), 6 (memorial & 5 estate recovery commands 50%)"
    referenced_by:
      - design/gdd/generation-succession.md
      - design/gdd/rift-seal-endless.md
  - name: inherited_curse
    source: design/gdd/generation-succession.md
    attributes:
      max_inherited_curses: 3
      pool: "curse_hollow_coffers, curse_ashen_blood, curse_whispering_rift, curse_heavy_crown, curse_faded_oath"
    referenced_by:
      - design/gdd/soul-exploitation.md
      - design/gdd/memorial-chronicle.md
  - name: chronicle_entry
    source: design/gdd/memorial-chronicle.md
    attributes:
      max_detailed_generations: 10
      outcomes: "FALLEN, SEALED_ATONEMENT, SEALED_TYRANT"
    referenced_by:
      - design/gdd/generation-succession.md
      - design/gdd/rift-seal-endless.md

items: []

formulas:
  - name: exploit_permanent_stress
    source: design/gdd/soul-exploitation.md
    variables: "base_exploit_stress(6), merc_level(1-12), stress_per_tier(1-2), min(4), max(12)"
    output_range: "4-12 (default 6-12)"
    referenced_by: []
  - name: exploit_suppress_amount
    source: design/gdd/soul-exploitation.md
    variables: "base_suppress(10), merc_level(1-12), suppress_per_level(3), grade_mult(0.7/1.0/1.3), clamp(5, 50), monster_tier(-1)"
    output_range: "5-50 (default 9-50) + monster_tier -1 (floor 0)"
    referenced_by: []
  - name: exploit_buff_atk
    source: design/gdd/soul-exploitation.md
    variables: "base_buff_atk(1), merc_level(1-12), atk_per_level(1.2), grade_mult(0.7/1.0/1.3)"
    output_range: "2-20 (default)"
    referenced_by: []
  - name: exploit_buff_crit
    source: design/gdd/soul-exploitation.md
    variables: "base_buff_crit(2.0), merc_level(1-12), crit_per_level(1.5), grade_mult(0.7/1.0/1.3)"
    output_range: "2.5-26.0% (default, clamped 0-100%)"
    referenced_by: []
  - name: brand_debuff
    source: design/gdd/soul-exploitation.md
    variables: "brand_stacks(0-15), diff_mult(1.0/1.5/2.0), recruit_pen(5.0), heal_pen(3.0), morale_pen(0.5 ceil)"
    output_range: "recruit 0-100% (+120% at morale 0), heal 0-45pp (floor 10%), morale 0 or 1-10/day"
    referenced_by:
      - design/gdd/generation-succession.md
  - name: memorial_restore
    source: design/gdd/soul-exploitation.md
    revised: 2026-11-24
    variables: "memorial_cost_gold(25), memorial_lv(1-5), base_morale(4), morale_per_lv(2), base_relief(5), relief_per_lv(2), corrupt_mult(0.5 at 6+)"
    output_range: "morale +4..+12 (halved at 6+, -2 if pauper), stress -5..-13 (0 if pauper)" # was: "morale +4..+12 (halved at 6+, 0 if pauper), stress -5..-13" before 2026-11-24
    referenced_by: []
  - name: unresolved_daily_stress
    source: design/gdd/soul-exploitation.md
    variables: "unresolved_count(0-99), daily_stress_per_relic(2), cap(10)"
    output_range: "0-10"
    referenced_by: []
  - name: inherited_curse_count
    source: design/gdd/generation-succession.md
    revised: 2026-11-24
    variables: "brand_stacks(0-15), stacks_per_curse(3), max_inherited_curses(3), cleansing_burn_min_days(5), cleansing_burn_min_clears(2)" # was: "brand_stacks(0-15), stacks_per_curse(3), max_inherited_curses(3)" before 2026-11-24
    output_range: "0 or 1-3 (early fall keeps all prev; normal 0-brand cleanses max 1/gen)" # was: "0 or 1-3 (min 1 at brand_stacks>=1)" before 2026-11-24
    referenced_by:
      - design/gdd/soul-exploitation.md
  - name: tyranny_ratio
    source: design/gdd/rift-seal-endless.md
    revised: 2026-11-24
    variables: "total_exploited_count, total_memorialized_count, total_pauper_buried_count, tyranny_threshold(0.40)" # was: "total_exploited_count, total_memorialized_count, tyranny_threshold(0.40)" before 2026-11-24
    output_range: "0.0-1.0"
    referenced_by:
      - design/gdd/memorial-chronicle.md
      - design/gdd/soul-exploitation.md
  - name: endless_monster_mult
    source: design/gdd/rift-seal-endless.md
    variables: "endless_cycle(0-99), endless_scale_per_cycle(0.20)"
    output_range: "1.0+"
    referenced_by: []

constants:
  - name: max_stress
    source: design/gdd/soul-exploitation.md
    value: 100
    unit: stress
    referenced_by:
      - design/gdd/generation-succession.md
  - name: memorial_cost_gold
    source: design/gdd/soul-exploitation.md
    value: 25
    unit: gold
    referenced_by: []
  - name: cap_unresolved_stress
    source: design/gdd/soul-exploitation.md
    value: 10
    unit: stress_per_day
    referenced_by: []
  - name: min_heal_success_rate
    source: design/gdd/soul-exploitation.md
    value: 10
    unit: percent
    referenced_by:
      - design/gdd/generation-succession.md
  - name: max_inherited_curses
    source: design/gdd/generation-succession.md
    value: 3
    unit: curses
    referenced_by: []
  - name: tyranny_threshold
    source: design/gdd/rift-seal-endless.md
    value: 0.40
    unit: ratio
    referenced_by: []
